name: Fetch RSS Deals

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip install feedparser beautifulsoup4 requests

      - name: Run RSS Deal Scraper
        run: python scripts/fetch_rss_deals.py

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add deals.json
          git commit -m "Updated RSS deals" || echo "No changes"
          git push
