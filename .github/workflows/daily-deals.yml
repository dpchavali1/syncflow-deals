name: Update Daily Deals

on:
  schedule:
    - cron: "0 14 * * *"  # 9 AM EST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Run Deal Fetch Script
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/fetch_deals.py

      - name: Commit Updated deals.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add deals.json
          git commit -m "Daily deals update" || echo "No changes"
          git push
