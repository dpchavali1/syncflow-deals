  name: Fetch RSS Deals                                                                                                                                                                                     
                                                                                                                                                                                                            
  on:                                                                                                                                                                                                       
    schedule:                                                                                                                                                                                               
      - cron: "0 */2 * * *"                                                                                                                                                                                 
    workflow_dispatch:                                                                                                                                                                                      
                                                                                                                                                                                                            
  # CRITICAL: Prevents queue buildup                                                                                                                                                                        
  concurrency:                                                                                                                                                                                              
    group: rss-deals-fetch                                                                                                                                                                                  
    cancel-in-progress: true                                                                                                                                                                                
                                                                                                                                                                                                            
  jobs:                                                                                                                                                                                                     
    build:                                                                                                                                                                                                  
      runs-on: ubuntu-22.04  # Specific version (more reliable than "latest")                                                                                                                               
      timeout-minutes: 8  # Kill stuck jobs                                                                                                                                                                 
                                                                                                                                                                                                            
      steps:                                                                                                                                                                                                
        - name: Checkout Repository                                                                                                                                                                         
          uses: actions/checkout@v4                                                                                                                                                                         
          with:                                                                                                                                                                                             
            fetch-depth: 1                                                                                                                                                                                  
                                                                                                                                                                                                            
        - name: Setup Python                                                                                                                                                                                
          uses: actions/setup-python@v5                                                                                                                                                                     
          with:                                                                                                                                                                                             
            python-version: "3.12"                                                                                                                                                                          
            cache: 'pip'                                                                                                                                                                                    
                                                                                                                                                                                                            
        - name: Install Dependencies                                                                                                                                                                        
          run: |                                                                                                                                                                                            
            pip install --no-cache-dir feedparser beautifulsoup4 requests                                                                                                                                   
                                                                                                                                                                                                            
        - name: Run RSS Deal Scraper                                                                                                                                                                        
          timeout-minutes: 3  # Scraper shouldn't take > 3 mins                                                                                                                                             
          run: python scripts/fetch_rss_deals.py                                                                                                                                                            
                                                                                                                                                                                                            
        - name: Check Changes                                                                                                                                                                               
          id: changes                                                                                                                                                                                       
          run: |                                                                                                                                                                                            
            if git diff --exit-code deals.json > /dev/null 2>&1; then                                                                                                                                       
              echo "changed=false" >> $GITHUB_OUTPUT                                                                                                                                                        
            else                                                                                                                                                                                            
              echo "changed=true" >> $GITHUB_OUTPUT                                                                                                                                                         
            fi                                                                                                                                                                                              
                                                                                                                                                                                                            
        - name: Commit Changes                                                                                                                                                                              
          if: steps.changes.outputs.changed == 'true'                                                                                                                                                       
          run: |                                                                                                                                                                                            
            git config user.name "github-actions[bot]"                                                                                                                                                      
            git config user.email "github-actions[bot]@users.noreply.github.com"                                                                                                                            
            git add deals.json                                                                                                                                                                              
            git commit -m "Update RSS deals [skip ci]"                                                                                                                                                      
                                                                                                                                                                                                            
            # Retry push 3 times                                                                                                                                                                            
            for i in {1..3}; do                                                                                                                                                                             
              if git push; then                                                                                                                                                                             
                echo "Push successful"                                                                                                                                                                      
                break                                                                                                                                                                                       
              else                                                                                                                                                                                          
                echo "Push failed, retrying in 3s..."                                                                                                                                                       
                sleep 3                                                                                                                                                                                     
                git pull --rebase                                                                                                                                                                           
              fi                                                                                                                                                                                            
            done          
